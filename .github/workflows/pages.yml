name: pages

# Three triggers, one job. The schedule is what keeps the versions and the catalog honest between pushes:
# a release cut in any repository, or a listing merged in botmaker-catalog, changes this site without
# anyone touching this one, and nobody should have to remember that. workflow_dispatch is for wanting it now.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      # Versions are read off github.com's release pages, not the REST API, so no token is needed.
      # A fetch that fails fails the build: nothing deploys and the site already published stays.
      - name: Build the site
        run: npm run build

      - name: Check the build leaves the project sites' paths alone
        run: node --test test/reserved-paths.test.mjs

      - name: Check every address on it
        run: tools/check-links.sh dist

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v5
